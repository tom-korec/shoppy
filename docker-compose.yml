services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: shoppy
      POSTGRES_PASSWORD: shoppy
      POSTGRES_DB: shoppy
    ports:
      - '${SHOPPY_DB_PORT:-5442}:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U shoppy']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db-data:
