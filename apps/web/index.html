<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Shared shopping lists for you and your household." />
    <meta name="theme-color" content="#059669" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Shoppy" />
    <title>Shoppy</title>
    <!-- Launch screen until the app renders: a cold start shows the logo instead of a blank page. -->
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #f8fafc;
      }
      .splash {
        display: flex;
        height: 100%;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        color: #059669;
        font:
          700 28px/1.2 ui-sans-serif,
          system-ui,
          sans-serif;
      }
      @media (prefers-color-scheme: dark) {
        html,
        body {
          background: #0b1120;
        }
        .splash {
          color: #10b981;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="splash" role="status">
        <svg width="96" height="96" viewBox="0 0 512 512" aria-hidden="true">
          <rect width="512" height="512" rx="112" fill="#059669" />
          <g
            fill="none"
            stroke="#fff"
            stroke-width="32"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M184 208l48-80M328 208l-48-80" />
            <path d="M104 208h304l-34 172a28 28 0 0 1-27.5 22.5h-181A28 28 0 0 1 138 380z" />
            <path d="M208 272v64M256 272v64M304 272v64" />
          </g>
        </svg>
        Shoppy
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
